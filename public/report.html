<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your private numerology report</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="wrap" id="app"><div class="card">Loading your report…</div></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const token = location.pathname.split('/').pop();
const app = document.getElementById('app');
fetch('/api/report/' + token).then(async r => {
  const d = await r.json();
  if (!r.ok) { app.innerHTML = `<div class="card"><h2>Report not found</h2><p>${esc(d.error)}</p><a class="btn" href="/">Get a new code</a></div>`; return; }
  const R = d.reading, n = R.numbers;
  const master = (v) => [11, 22, 33].includes(v) ? '<span class="pill">Master number</span>' : '';
  const sec = (s) => `<div class="card sec"><h3>${esc(s.label)}: <em>${s.number}</em> · ${esc(s.title)} ${master(s.number)}</h3><p>${esc(s.text)}</p></div>`;
  const exp = new Date(d.expiresAt);
  app.innerHTML = `
    <div class="hero"><img src="/assets/mira2.jpg" alt="" onerror="this.style.display='none'">
    <h1>${esc(R.displayName)}'s Numerology Report</h1>
    <p class="sub">Born ${esc(R.dob)} · Code <b>${esc(d.code)}</b> ${d.used ? '· revealed on LIVE ✓' : '· not used yet'}</p></div>
    <div class="card">
      <h2>Your core numbers</h2>
      <div class="numgrid">
        ${[['Life Path', n.lifePath], ['Destiny', n.expression], ['Soul Urge', n.soulUrge], ['Personality', n.personality], ['Birthday', n.birthday], ['Maturity', n.maturity], ['Year ' + R.year, n.personalYear]].map(([l, v]) => `<div class="medal"><b>${v}</b><span>${l}</span></div>`).join('')}
      </div>
      <p class="calc">Calculated with the traditional Pythagorean system from your full birth name "${esc(R.fullName)}" and date of birth. The same details always give the same numbers.</p>
    </div>
    ${R.answer ? `<div class="card sec"><h3>Your question</h3><p><i>“${esc(R.answer.question)}”</i></p><p>${esc(R.answer.text)}</p></div>` : ''}
    ${R.sections.map(sec).join('')}
    ${R.family.length ? `<div class="card sec"><h3>Family influence</h3>${R.family.map(f => `<p><b>${esc(f.label)}: ${f.number}</b> · ${esc(f.title)}. Your ${f.key === 'mother' ? "mother's" : "father's"} name ${esc(f.text)}</p>`).join('')}</div>` : ''}
    <div class="card noprint">
      <p class="note">This report is private. It will be deleted automatically on <b>${exp.toLocaleString()}</b>.</p>
      <button type="button" onclick="print()">🖨️ Save as PDF / print</button>
      <div style="height:10px"></div>
      <button type="button" class="ghost" id="del">Delete my data now</button>
    </div>
    <p class="disclaimer">${esc(R.disclaimer)}</p>`;
  document.getElementById('del').onclick = async () => {
    if (!confirm('Delete your details and this report permanently?')) return;
    await fetch('/api/report/' + token, { method: 'DELETE' });
    app.innerHTML = '<div class="card"><h2>Deleted</h2><p>Your details and report have been removed.</p></div>';
  };
});
</script>
</body>
</html>
